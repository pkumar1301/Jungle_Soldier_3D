<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#556}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
import * as pc from '../js/playcanvas.min.mjs';
const q=new URLSearchParams(location.search);
const list=q.get('m').split(','), clip=q.get('clip')||'', spacing=+(q.get('sp')||2.2), H=+(q.get('h')||0);
const app=new pc.Application(document.getElementById('c'),{graphicsDeviceOptions:{preserveDrawingBuffer:true,antialias:true}});
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);
const b64=await (await fetch('../assets/qwantani_dusk_1k.rgbe.b64.txt')).text();const bin=atob(b64.trim()),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
const hdr=new pc.Texture(app.graphicsDevice,{width:1024,height:512,format:pc.PIXELFORMAT_RGBA8,type:pc.TEXTURETYPE_RGBE,mipmaps:false,projection:pc.TEXTUREPROJECTION_EQUIRECT,levels:[u]});
app.scene.envAtlas=pc.EnvLighting.generateAtlas(pc.EnvLighting.generateLightingSource(hdr));app.scene.skyboxIntensity=1.2;
const cam=new pc.Entity();cam.addComponent('camera',{clearColor:new pc.Color(.3,.34,.3),toneMapping:pc.TONEMAP_ACES2,fov:30});app.root.addChild(cam);
const sun=new pc.Entity();sun.addComponent('light',{type:'directional',intensity:2.4,color:new pc.Color(1,.95,.85),castShadows:true,shadowDistance:40,shadowResolution:2048});sun.setEulerAngles(50,35,0);app.root.addChild(sun);
const gm=new pc.StandardMaterial();gm.diffuse=new pc.Color(.25,.3,.22);gm.update();const gr=new pc.Entity();gr.addComponent('render',{type:'plane',material:gm});gr.setLocalScale(60,1,60);app.root.addChild(gr);
app.start();
const load=url=>new Promise((res,rej)=>app.assets.loadFromUrl(url,'container',(e,a)=>e?rej(e):res(a.resource)));
let maxH=0;const ents=[];
for(let k=0;k<list.length;k++){
  const r=await load(list[k]);const e=r.instantiateRenderEntity({castShadows:true});app.root.addChild(e);
  if(r.animations.length){e.addComponent('anim',{activate:true});const tr=r.animations.map(a=>a.resource);const pick=tr.find(t=>clip.split('|').some(c=>c&&t.name.endsWith(c)))||tr[0];e.anim.assignAnimation('a',pick);}
  ents.push(e);
}
await new Promise(r=>setTimeout(r,300));
// normalise heights to 1.6 m unless h=0 keeps native
for(const [k,e] of ents.entries()){
  const b=new pc.BoundingBox();let f=true;e.findComponents('render').forEach(r=>r.meshInstances.forEach(mi=>{if(f){b.copy(mi.aabb);f=false}else b.add(mi.aabb)}));
  const s=H?H/(b.halfExtents.y*2):1;e.setLocalScale(s,s,s);e.setPosition((k-(ents.length-1)/2)*spacing,-(b.center.y-b.halfExtents.y)*s,0);
  maxH=Math.max(maxH,b.halfExtents.y*2*s);
}
const w=ents.length*spacing;const Z=+(q.get("z")||(w*.95));cam.setPosition(0,1.3,Z);cam.lookAt(0,.75,0);
window.ready=true;
</script></body></html>
