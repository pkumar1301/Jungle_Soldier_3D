<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#333}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
import * as pc from '../js/playcanvas.min.mjs';
const q=new URLSearchParams(location.search); const list=q.get('m').split(',');
const app=new pc.Application(document.getElementById('c'),{graphicsDeviceOptions:{preserveDrawingBuffer:true,antialias:true}});
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);
app.scene.ambientLight=new pc.Color(.5,.5,.5);
const cam=new pc.Entity();cam.addComponent('camera',{clearColor:new pc.Color(.25,.3,.25),fov:40});app.root.addChild(cam);
const sun=new pc.Entity();sun.addComponent('light',{type:'directional',intensity:2});sun.setEulerAngles(50,30,0);app.root.addChild(sun);
// arrow pointing +Z under each model
app.start(); const info=[];
for(let k=0;k<list.length;k++){
  const [file,clip]=list[k].split(':');const r=await new Promise((res,rej)=>app.assets.loadFromUrl('../models/'+file,'container',(e,a)=>e?rej(e):res(a.resource)));
  const e=r.instantiateRenderEntity();app.root.addChild(e);
  if(r.animations.length){e.addComponent('anim',{activate:true});const tr=r.animations.map(a=>a.resource);e.anim.assignAnimation('a',(clip&&tr.find(t=>new RegExp(clip).test(t.name)))||tr[0]);}
  await new Promise(r=>setTimeout(r,200));
  const b=new pc.BoundingBox();let f=true;e.findComponents('render').forEach(rc=>rc.meshInstances.forEach(mi=>{if(f){b.copy(mi.aabb);f=false}else b.add(mi.aabb)}));
  const s=1.6/Math.max(b.halfExtents.x*2,b.halfExtents.y*2,b.halfExtents.z*2);
  e.setLocalScale(s,s,s); e.setPosition(k*2.2-(list.length-1)*1.1 - b.center.x*s, -(b.center.y-b.halfExtents.y)*s, -b.center.z*s);
  const ar=new pc.Entity();ar.addComponent('render',{type:'box'});ar.setLocalScale(.06,.02,1.2);ar.setPosition(k*2.2-(list.length-1)*1.1,0,.6);app.root.addChild(ar);
  info.push({m:list[k],size:[b.halfExtents.x*2,b.halfExtents.y*2,b.halfExtents.z*2].map(v=>+v.toFixed(3)),center:[b.center.x,b.center.y,b.center.z].map(v=>+v.toFixed(3))});
}
const top=q.get("top");if(top){cam.setPosition(0,9,.01);cam.lookAt(0,0,0);}else{cam.setPosition(0,3.2,7.5);cam.lookAt(0,.5,0);}window.info=info;window.ready=true;
</script></body></html>
